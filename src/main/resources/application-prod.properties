# Production profile — todas as variaveis sensiveis DEVEM ser definidas via env
# Startup falha se DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET ou CORS_ALLOWED_ORIGINS nao estiverem definidos

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console desabilitado em prod
spring.h2.console.enabled=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Cache — UserDetails cache via Redis (distribuído entre instâncias)
spring.cache.type=redis
spring.cache.redis.time-to-live=60s

# JWT — sem defaults em prod
jwt.secret=${JWT_SECRET}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

# CORS — sem defaults em prod
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}

# Actuator — expoe apenas health e info; sem swagger
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# Swagger desabilitado em prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Rate limiting — mais restrito em prod
rate.limit.login.window-seconds=${LOGIN_RATE_WINDOW_SECONDS:60}
rate.limit.login.max-requests=${LOGIN_RATE_MAX_REQUESTS:5}

# Funciona corretamente atras de proxy/nginx (X-Forwarded-For, X-Forwarded-Proto)
server.forward-headers-strategy=native

# Lockout por usuário (prod) — sem defaults, obrigatório via env
auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}

# Limite de sessões ativas simultâneas por usuário (0 = sem limite)
auth.max-sessions-per-user=${AUTH_MAX_SESSIONS_PER_USER:5}

# Email verification (prod) — sem defaults para api-key
email.verification.ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:15}
email.verification.resend-cooldown-seconds=${EMAIL_RESEND_COOLDOWN_SECONDS:60}
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# Scheduler
refresh-token.cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

# Security headers
security.content-security-policy=${SECURITY_CSP:default-src 'none'; frame-ancestors 'none'}

# 2FA / TOTP — gere com: openssl rand -base64 32
totp.encryption.key=${TOTP_ENCRYPTION_KEY}
totp.app-name=${TOTP_APP_NAME:security-spring}
