# Production profile — todas as variaveis sensiveis DEVEM ser definidas via env
# Startup falha se DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET ou CORS_ALLOWED_ORIGINS nao estiverem definidos

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 console desabilitado em prod
spring.h2.console.enabled=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# JWT — sem defaults em prod
jwt.secret=${JWT_SECRET}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# CORS — sem defaults em prod
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}

# Actuator — expoe apenas health e info; sem swagger
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# Swagger desabilitado em prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Rate limiting — mais restrito em prod
rate.limit.login.window-seconds=${LOGIN_RATE_WINDOW_SECONDS:60}
rate.limit.login.max-requests=${LOGIN_RATE_MAX_REQUESTS:5}

# Funciona corretamente atras de proxy/nginx (X-Forwarded-For, X-Forwarded-Proto)
server.forward-headers-strategy=native
