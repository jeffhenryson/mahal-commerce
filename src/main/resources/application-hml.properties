# Homologacao (staging) profile - PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/security}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Usar Flyway para schema; desabilitar DDL auto
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.show-sql=false

# H2 console disabled in hml
spring.h2.console.enabled=false

# JWT (hml) - always set via env in CI/CD
jwt.secret=${JWT_SECRET:change-this-in-env}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# CORS (definir via env em hml)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}

# Actuator exposure in hml (ajuste origens no gateway/reverso)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
