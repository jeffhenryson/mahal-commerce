<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Pedido recebido</title></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <tr><td style="background:#15803d;padding:24px 32px">
        <span style="color:#fff;font-size:1.25rem;font-weight:bold">Cerne Commerce — Pedido recebido</span>
      </td></tr>
      <tr><td style="padding:32px">
        <h2 style="margin:0 0 16px;color:#15803d">Recebemos seu pedido <span th:text="${orderReference}">#123</span></h2>
        <p style="color:#333">Olá, <strong th:text="${customerName}">cliente</strong>!</p>
        <p style="color:#333">Seu pedido foi registrado com sucesso. Assim que o pagamento for confirmado, avisaremos por aqui.</p>
        <table width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9;border-radius:6px;margin:20px 0">
          <tr>
            <td style="padding:16px 20px;color:#555">Itens</td>
            <td style="padding:16px 20px;color:#333;text-align:right" th:text="${itemCount}">3</td>
          </tr>
          <tr>
            <td style="padding:0 20px 16px;color:#555">Total</td>
            <td style="padding:0 20px 16px;color:#333;text-align:right;font-weight:bold" th:text="${total}">R$ 0,00</td>
          </tr>
        </table>
        <p th:if="${checkoutUrl}" style="text-align:center;margin:24px 0">
          <a th:href="${checkoutUrl}" style="background:#15803d;color:#fff;text-decoration:none;padding:12px 24px;border-radius:6px;display:inline-block">Concluir pagamento</a>
        </p>
      </td></tr>
      <tr><td style="background:#f9f9f9;padding:16px 32px;border-top:1px solid #eee">
        <p style="color:#aaa;font-size:.75rem;margin:0;text-align:center">
          &copy; Cerne Commerce — Enviado automaticamente, não responda este email.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
