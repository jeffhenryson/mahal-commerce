<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Pedido cancelado</title></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <tr><td style="background:#b91c1c;padding:24px 32px">
        <span style="color:#fff;font-size:1.25rem;font-weight:bold" th:text="${refunded} ? 'Cerne Commerce — Pedido reembolsado' : 'Cerne Commerce — Pedido cancelado'">Cerne Commerce — Pedido cancelado</span>
      </td></tr>
      <tr><td style="padding:32px">
        <h2 style="margin:0 0 16px;color:#b91c1c" th:text="${refunded} ? 'Seu pedido foi reembolsado' : 'Seu pedido foi cancelado'">Seu pedido foi cancelado</h2>
        <p style="color:#333">Olá, <strong th:text="${customerName}">cliente</strong>!</p>
        <p style="color:#333">
          O pedido <strong th:text="${orderReference}">#123</strong>
          <span th:text="${refunded} ? 'foi reembolsado.' : 'foi cancelado.'">foi cancelado.</span>
        </p>
        <div style="background:#fff3f3;border-left:4px solid #b91c1c;padding:12px 16px;margin:20px 0;border-radius:0 6px 6px 0">
          <p style="color:#555;font-size:.875rem;margin:0" th:text="${reason}">Motivo</p>
        </div>
      </td></tr>
      <tr><td style="background:#f9f9f9;padding:16px 32px;border-top:1px solid #eee">
        <p style="color:#aaa;font-size:.75rem;margin:0;text-align:center">
          &copy; Cerne Commerce — Enviado automaticamente, não responda este email.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
