# ─────────────────────────────────────────────────────────────────────────────
# Perfil "shell" — CLI administrativo interativo via Spring Shell
#
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,shell
#      java -jar app.jar --spring.profiles.active=dev,shell
# ─────────────────────────────────────────────────────────────────────────────

# Desativa o servidor web — o shell roda como aplicação standalone
spring.main.web-application-type=none

# Habilita o terminal interativo do Spring Shell
spring.shell.interactive.enabled=true
