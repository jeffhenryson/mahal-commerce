# Exclui a auto-configuração do Spring Shell em testes com perfil dev.
# Spring Shell 4.0.0 tem um bug: JLineShellAutoConfiguration.commandCompleter
# usa @ConditionalOnMissingBean que falha ao tentar introspectar JLine
# (NoClassDefFoundError: org/jline/reader/Parser) mesmo em contextos web.
# Em runtime (./mvnw spring-boot:run -Pdev,shell) este arquivo não é carregado.
spring.autoconfigure.exclude=org.springframework.shell.core.autoconfigure.SpringShellAutoConfiguration
