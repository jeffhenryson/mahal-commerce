# Exclui a auto-configuração do Spring Shell em testes.
# Spring Shell 4.0.0 tem um bug em JLineShellAutoConfiguration.commandCompleter
# (@ConditionalOnMissingBean falha ao deduzir o tipo do bean) que quebra todos
# os contextos @SpringBootTest. Esta exclusão é SOMENTE de teste — em runtime
# o Shell funciona normalmente quando ativado com --spring.profiles.active=shell.
spring.autoconfigure.exclude=org.springframework.shell.core.autoconfigure.SpringShellAutoConfiguration
