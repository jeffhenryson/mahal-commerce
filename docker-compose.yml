version: "3.9"

# Stack de homologação: PostgreSQL + Redis + Prometheus
# Uso: docker compose up -d
# A aplicação roda fora do compose — inicie com SPRING_PROFILES_ACTIVE=hml ./mvnw spring-boot:run
# Prometheus scrapa http://host.docker.internal:8080/actuator/prometheus a cada 15s

services:
  postgres-hml:
    image: postgres:16-alpine
    container_name: postgres-hml
    restart: unless-stopped
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_hml:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-hml:
    image: redis:7-alpine
    container_name: redis-hml
    restart: unless-stopped
    command: redis-server --requirepass hml_redis_2026
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hml_redis_2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus-hml:
    image: prom/prometheus:v2.52.0
    container_name: prometheus-hml
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata_hml:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana-hml:
    image: grafana/grafana:11.0.0
    container_name: grafana-hml
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - grafanadata_hml:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-hml
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata_hml:
  prometheusdata_hml:
  grafanadata_hml:
