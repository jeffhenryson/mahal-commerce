version: "3.9"

# ⚠️ OBSOLETO — SUBSTITUÍDO POR docker-compose.hml.yml (projeto mahal-commerce-hml).
#
# Este arquivo NÃO FUNCIONA como está: declara os volumes `security-spring_pgdata_hml`,
# `security-spring_prometheusdata_hml` e `security-spring_grafanadata_hml` como
# `external: true`, e nenhum deles existe nesta máquina (`docker volume ls` lista
# `mahal_postgres_mahal_data` e `cerne-commerce_pgdata_hml`). Um `docker compose up`
# aqui aborta com "external volume not found".
#
# Também não é o arquivo que criava os containers em execução: quem faz isso hoje é o
# compose do diretório PAI (../docker-compose.yml, projeto "mahal"). Ver PLAT-C024.
#
# Use docker-compose.hml.yml. Este arquivo pode ser removido depois de confirmada a
# migração — mantido por ora só para referência do que existia.
#
# Stack de homologação: PostgreSQL + Redis + Prometheus + Grafana + app (mahal-backend)
# Uso: docker compose up -d
# Prometheus scrapa mahal-backend:8081/actuator/prometheus a cada 15s (rede interna do
# compose — ver prometheus.yml; porta 8081 é o management.server.port do perfil hml, sem
# filtro JWT). Para rodar a app fora do compose: SPRING_PROFILES_ACTIVE=hml ./mvnw spring-boot:run
#
# Requer um .env na raiz do projeto (nunca versionado — ver .env.example) com:
# DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET, TOTP_ENCRYPTION_KEY, RESEND_API_KEY, GOOGLE_CLIENT_ID
#
# Frontends (mahal-admin-ui:4201, mahal-market-ui:4300) — C013: propositalmente ausentes
# deste compose. Em hml/local, cada um vive em seu próprio repositório sibling
# (../mahal-commerce-ui, ../mahal-commerce-ui-market) com seu próprio docker-compose.yml,
# que se conecta à network externa "cerne-commerce_default" criada por este arquivo.
# Suba o backend primeiro (docker compose up -d aqui), depois cada frontend separadamente
# (docker compose up -d dentro de cada repositório sibling). Em produção, os três serviços
# são unificados em docker-compose.prod.yml (build context ./cerne-commerce-ui e
# ./mahal-commerce-ui-market, espera os repositórios de frontend como diretórios sibling
# já clonados no host de deploy). Ver docs/architecture.md ("Topologia de deploy") para detalhes.

services:
  postgres-mahal:
    image: postgres:16-alpine
    container_name: postgres-mahal
    restart: unless-stopped
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_hml:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-mahal:
    image: redis:7-alpine
    container_name: redis-mahal
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus-mahal:
    image: prom/prometheus:v2.52.0
    container_name: prometheus-mahal
    restart: unless-stopped
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata_hml:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana-mahal:
    image: grafana/grafana:11.0.0
    container_name: grafana-mahal
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_SERVER_ROOT_URL: "http://localhost:3002"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - grafanadata_hml:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-mahal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mahal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mahal-commerce-backend:latest
    container_name: mahal-backend
    restart: unless-stopped
    depends_on:
      postgres-mahal:
        condition: service_healthy
      redis-mahal:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: hml
      DB_URL: jdbc:postgresql://postgres-mahal:5432/security
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-mahal
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      JWT_ISSUER: mahaltabacaria-api
      JWT_AUDIENCE: mahaltabacaria-ui
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4300
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: noreply@cernedsgn.xyz
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "8082:8082"
      - "8083:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata_hml:
    external: true
    name: security-spring_pgdata_hml
  prometheusdata_hml:
    external: true
    name: security-spring_prometheusdata_hml
  grafanadata_hml:
    external: true
    name: security-spring_grafanadata_hml

networks:
  default:
    name: cerne-commerce_default

