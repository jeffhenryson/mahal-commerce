version: "3.9"

services:
  postgres-hml:
    image: postgres:16-alpine
    container_name: postgres-hml
    restart: unless-stopped
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_hml:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-hml:
    image: redis:7-alpine
    container_name: redis-hml
    restart: unless-stopped
    command: redis-server --requirepass hml_redis_2026
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hml_redis_2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_hml:
